<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Reviews | Shadow Travel Hub – Car Travels in Ooty</title>
<meta name="description" content="Read reviews of Shadow Travel Hub car travels in Ooty, Ooty to Coimbatore trips, sightseeing tours and airport transfers.">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--green:#0f7a2b;--dark:#0b0f0c;--gold:#d9a02b;--light:#f4f8f3;--text:#2b332d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;background:var(--light);color:var(--text);line-height:1.6}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 20px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.logo{font-family:'Fredoka',sans-serif;font-size:1.4rem;color:var(--green);text-decoration:none}
.logo span{color:var(--gold)}
.nav a.back{color:var(--text);font-weight:600;text-decoration:none}
.hero{background:var(--dark);color:#fff;text-align:center;padding:48px 20px}
.hero h1{font-family:'Fredoka',sans-serif;font-size:2rem}
.stars{color:var(--gold);letter-spacing:2px}
.wrap{max-width:900px;margin:0 auto;padding:32px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.card p{margin:8px 0;word-wrap:break-word}
.card small{color:var(--green);font-weight:600}
h2{font-family:'Fredoka',sans-serif;color:var(--green);margin:36px 0 14px}
form{background:#fff;border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.07);display:grid;gap:12px}
label{font-weight:600;font-size:.9rem}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #cfd8d1;border-radius:8px;font:inherit}
.rate{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:4px}
.rate input{display:none}
.rate label{font-size:2rem;color:#ccc;cursor:pointer}
.rate input:checked~label,.rate label:hover,.rate label:hover~label{color:var(--gold)}
button,.btn{background:var(--green);color:#fff;border:0;border-radius:8px;padding:12px 20px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.wa{background:#25d366}
.contact{text-align:center}
.contact .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
#msg{text-align:center;font-weight:600;color:var(--green)}
footer{text-align:center;padding:24px;color:#777;font-size:.85rem}
</style>
</head>
<body>
<header class="nav">
  <a class="logo" href="index.html">Shadow <span>Travel Hub</span></a>
  <a class="back" href="index.html">← Home</a>
</header>

<section class="hero">
  <h1>Customer Reviews</h1>
  <p class="stars">★★★★★</p>
  <p>What our travellers say about car travels in Ooty</p>
</section>

<main class="wrap">
  <div class="grid" id="list"><p>Loading reviews...</p></div>

  <h2>Share Your Experience</h2>
  <form id="f">
    <div><label for="n">Your name</label><input id="n" maxlength="60" required></div>
    <div><label for="s">Service used</label>
      <select id="s"><option>Sightseeing Tour</option><option>Ooty to Coimbatore</option><option>Airport Transfer</option><option>Pickup &amp; Drop</option><option>Other</option></select></div>
    <div><label>Rating</label>
      <div class="rate">
        <input type="radio" name="r" id="r5" value="5" checked><label for="r5">★</label>
        <input type="radio" name="r" id="r4" value="4"><label for="r4">★</label>
        <input type="radio" name="r" id="r3" value="3"><label for="r3">★</label>
        <input type="radio" name="r" id="r2" value="2"><label for="r2">★</label>
        <input type="radio" name="r" id="r1" value="1"><label for="r1">★</label>
      </div></div>
    <div><label for="m">Your review</label><textarea id="m" rows="4" maxlength="500" required></textarea></div>
    <button type="submit" id="sub">Submit Review</button>
    <p id="msg"></p>
  </form>

  <section class="contact">
    <h2>Contact Us</h2>
    <p>Book your car travel in Ooty today</p>
    <p><strong id="shownum"></strong></p>
    <div class="row">
      <a class="btn" id="callbtn" href="#">📞 Call Now</a>
      <a class="btn wa" id="wabtn" href="#" target="_blank" rel="noopener">WhatsApp Us</a>
    </div>
  </section>
</main>
<footer>© Shadow Travel Hub – Car Travels in Ooty</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== EDIT HERE =====
var PHONE="91XXXXXXXXXX";        // contact number: country code + number
var SHOW="+91 XXXXX XXXXX";      // how it appears on the page
var firebaseConfig = {
  // PASTE HERE the values from Firebase (apiKey, authDomain, projectId, storageBucket, messagingSenderId, appId)
};
// =====================

document.getElementById("callbtn").href="tel:+"+PHONE;
document.getElementById("wabtn").href="https://wa.me/"+PHONE+"?text="+encodeURIComponent("Hi Shadow Travel Hub, I want to book a car.");
document.getElementById("shownum").textContent=SHOW;

firebase.initializeApp(firebaseConfig);
var col=firebase.firestore().collection("reviews");
var list=document.getElementById("list");

col.orderBy("createdAt","desc").limit(50).onSnapshot(function(snap){
  list.innerHTML="";
  if(snap.empty){list.innerHTML="<p>No reviews yet. Be the first!</p>";return;}
  snap.forEach(function(d){
    var v=d.data();
    var card=document.createElement("div");card.className="card";
    var st=document.createElement("div");st.className="stars";
    st.textContent="★".repeat(v.rating)+"☆".repeat(5-v.rating);
    var p=document.createElement("p");p.textContent=v.message;
    var sm=document.createElement("small");sm.textContent="— "+v.name+" ("+v.service+")";
    card.append(st,p,sm);list.appendChild(card);
  });
},function(){list.innerHTML="<p>Reviews could not be loaded.</p>";});

document.getElementById("f").addEventListener("submit",function(e){
  e.preventDefault();
  var btn=document.getElementById("sub"),msg=document.getElementById("msg");
  btn.disabled=true;
  col.add({
    name:document.getElementById("n").value.trim(),
    service:document.getElementById("s").value,
    rating:parseInt(document.querySelector("input[name=r]:checked").value,10),
    message:document.getElementById("m").value.trim(),
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    msg.textContent="Thank you! Your review is now on the website.";
    e.target.reset();btn.disabled=false;
  }).catch(function(){
    msg.textContent="Sorry, something went wrong. Please try again.";
    btn.disabled=false;
  });
});
</script>
</body>
</html>
